# Render Blueprint — DocuChat with OpenAI-backed answers.
# Add LLM_API_KEY in the Render dashboard's Environment settings.
services:
  - type: web
    name: docuchat
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Keep the free Render instance lightweight. These hashed embeddings are
      # lexical-only, so retrieval includes intent-aware keyword expansion.
      - key: USE_FAKE_EMBEDDINGS
        value: "true"
      # Do not silently serve extractive demo answers. A missing API key should
      # produce a clear setup notice instead of misleading passage dumps.
      - key: USE_FAKE_LLM
        value: "false"
      - key: LLM_BASE_URL
        value: "https://api.openai.com/v1"
      - key: LLM_MODEL
        value: "gpt-4o-mini"
      # No DATABASE_URL → default SQLite (ephemeral on the free plan).
