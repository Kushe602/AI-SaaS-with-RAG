# Render Blueprint — one-click deploy of DocuChat in its keyless demo mode.
# In the Render dashboard: New + → Blueprint, connect this repo, and Render
# reads this file, builds the Dockerfile, and provisions the service below.
services:
  - type: web
    name: docuchat
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true          # redeploy on every push to the default branch
    envVars:
      # Signs JWT session cookies — Render generates a strong random value once.
      - key: SECRET_KEY
        generateValue: true
      # Keep the free Render instance lightweight: loading ONNX/FastEmbed on the
      # first upload can exhaust memory and cause the request to return 502.
      # Use deterministic local embeddings here; semantic embeddings need a
      # service with enough memory and should be enabled only after load testing.
      - key: USE_FAKE_EMBEDDINGS
        value: "true"
      # Assemble cited answers from the retrieved passages instead of calling
      #   the model, so the upload → retrieve → answer flow runs live with no key.
      - key: USE_FAKE_LLM
        value: "true"
      # No DATABASE_URL → default SQLite (ephemeral on the free plan: uploaded
      #   docs reset when the instance sleeps/redeploys — fine for a demo).
