services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docuchat
      POSTGRES_PASSWORD: docuchat
      POSTGRES_DB: docuchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://docuchat:docuchat@db:5432/docuchat
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.justwoker.icu/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      USE_FAKE_EMBEDDINGS: ${USE_FAKE_EMBEDDINGS:-0}

volumes:
  pgdata:
