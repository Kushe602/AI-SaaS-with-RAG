{% extends "base.html" %}
{% block title %}Sign in — DocuChat{% endblock %}
{% block body %}
<main class="flex min-h-screen items-center justify-center px-6">
  <div class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <a href="/" class="mb-6 block text-center text-lg font-bold">📄 DocuChat</a>
    <h1 class="text-xl font-semibold">Welcome back</h1>
    <p class="mt-1 text-sm text-slate-500">Sign in to your account.</p>

    <form hx-post="/login" hx-target="#auth-error" hx-swap="innerHTML" class="mt-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700">Email</label>
        <input name="email" type="email" required autocomplete="email"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-indigo-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">Password</label>
        <input name="password" type="password" required autocomplete="current-password"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-indigo-500" />
      </div>
      <div id="auth-error"></div>
      <button type="submit"
              class="w-full rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-500">
        Sign in
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      No account? <a href="/register" class="font-medium text-indigo-600 hover:underline">Create one</a>
    </p>
  </div>
</main>
{% endblock %}
