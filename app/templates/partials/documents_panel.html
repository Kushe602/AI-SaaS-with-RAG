<div id="documents-panel" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
  <div class="mb-3 flex items-center justify-between text-sm">
    <span class="text-slate-500">{{ documents_used }}/{{ documents_limit }} documents used</span>
  </div>

  <form hx-post="/documents/upload"
        hx-target="#documents-panel"
        hx-swap="outerHTML"
        hx-encoding="multipart/form-data"
        class="flex items-center gap-2">
    <input type="file" name="file" accept=".pdf,.txt,.md,.markdown" required
           class="flex-1 text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-slate-100 file:px-3 file:py-2 file:text-sm file:font-medium hover:file:bg-slate-200" />
    <button type="submit" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700">
      Upload
    </button>
    <span class="htmx-indicator text-sm text-slate-400">Processing…</span>
  </form>

  {% if error %}
    <p class="mt-2 text-sm text-red-600">{{ error }}</p>
  {% endif %}

  <ul class="mt-4 divide-y divide-slate-100">
    {% for doc in documents %}
    <li class="flex items-center justify-between py-3">
      <div class="min-w-0">
        <p class="truncate text-sm font-medium text-slate-800">{{ doc.filename }}</p>
        <p class="text-xs text-slate-400">{{ doc.num_chunks }} chunks</p>
      </div>
      <button hx-post="/documents/{{ doc.id }}/delete"
              hx-target="#documents-panel"
              hx-swap="outerHTML"
              hx-confirm="Delete this document?"
              class="rounded-lg px-2 py-1 text-xs font-medium text-red-600 hover:bg-red-50">
        Delete
      </button>
    </li>
    {% else %}
    <li class="py-6 text-center text-sm text-slate-400">No documents yet. Upload a PDF or text file.</li>
    {% endfor %}
  </ul>
</div>
