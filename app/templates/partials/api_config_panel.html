<section id="api-config-panel" class="mb-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
  <h2 class="text-lg font-semibold">AI API configuration</h2>
  <p class="mt-1 text-sm text-slate-400">Choose the provider, endpoint, model, and personal credential used for chat answers.</p>
  <form action="/settings/api/save" method="post" class="mt-4 space-y-3">
    <label class="block text-sm">Provider name
      <input name="provider" required value="{{ api_config.provider if api_config else 'OpenAI' }}" class="mt-1 w-full rounded-lg border px-3 py-2" />
    </label>
    <label class="block text-sm">Model name
      <input name="model" required value="{{ api_config.model if api_config else 'gpt-4o-mini' }}" class="mt-1 w-full rounded-lg border px-3 py-2" />
    </label>
    <label class="block text-sm">API base URL
      <input name="base_url" type="url" required value="{{ api_config.base_url if api_config else 'https://api.openai.com/v1' }}" class="mt-1 w-full rounded-lg border px-3 py-2" />
    </label>
    <label class="block text-sm">Personal credential
      <input name="api_key" type="password" autocomplete="new-password" {% if not api_configured %}required{% endif %} class="mt-1 w-full rounded-lg border px-3 py-2" />
    </label>
    <p class="text-xs text-slate-400">The credential is encrypted before database storage and is never shown again.</p>
    <div class="flex flex-wrap gap-2"><button type="submit" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white">Save configuration</button><button type="button" id="test-api-config" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold">Test connection</button></div>
    <div id="api-test-result" aria-live="polite" class="text-sm"></div>
  </form>
  {% if api_configured %}
  <form action="/settings/api/remove" method="post" class="mt-3">
    <button type="submit" class="text-sm text-red-400">Remove personal configuration</button>
  </form>
  {% endif %}
</section>
<script>
(() => {
  const form = document.querySelector('#api-config-panel form[action="/settings/api/save"]');
  const button = document.getElementById("test-api-config");
  const result = document.getElementById("api-test-result");
  if (!form || !button || !result) return;
  button.addEventListener("click", async () => {
    button.disabled = true;
    result.textContent = "Testing connection…";
    try {
      const response = await fetch("/settings/api/test", {
        method: "POST", body: new FormData(form), credentials: "same-origin"
      });
      result.innerHTML = await response.text();
    } catch (_) {
      result.textContent = "Could not reach the server. Try again.";
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
