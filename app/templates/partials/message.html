{% if message.role == 'user' %}
<div class="flex justify-end">
  <div class="bubble bg-indigo-600 text-white whitespace-pre-wrap">{{ message.content }}</div>
</div>
{% else %}
<div class="flex justify-start">
  <div class="bubble border border-slate-200 bg-white text-slate-800">
    <div class="js-answer js-render prose-answer" data-mid="{{ message.id }}"></div>
    <div class="js-md-src hidden">{{ message.content }}</div>
    {% set citations = message.citations | fromjson %}
    {% set mid = message.id %}
    {% include "partials/sources.html" %}
  </div>
</div>
{% endif %}
